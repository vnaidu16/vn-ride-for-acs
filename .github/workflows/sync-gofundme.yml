name: Sync GoFundMe totals

on:
  schedule:
    # Nominally every 15 minutes. In practice GitHub throttles scheduled jobs on
    # shared runners hard, and this one actually lands about three times a day
    # (observed Aug 31: 00:16, 05:56, 13:25 UTC). Do not size any staleness
    # warning in index.html against the interval written here; use a day scale.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gofundme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate totals
        run: python3 .github/scripts/sync_gofundme.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change, nothing to commit."
            exit 0
          fi
          git config user.name "gofundme-sync"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Sync GoFundMe totals"
          git push
